# ══════════════════════════════════════════════════════════════════
# 🤖 المسح التلقائي اليومي — تداول بلس
# يفتح markets-a.com بحساب الروبوت ويشغّل المسح، فيتحدّث التحليل للجميع
# بلا أن تفتح التطبيق بنفسك. يعمل مجاناً على خوادم GitHub.
# ══════════════════════════════════════════════════════════════════
name: المسح التلقائي اليومي

on:
  schedule:
    # 17:00 UTC = 8:00 مساءً بتوقيت الرياض · الأحد–الخميس (أسبوع تداول السعودية)
    #
    # ⏰ أُخّر من 4 عصراً إلى 8 مساءً — بدليلٍ لا بتخمين:
    #    في 23 أغسطس 2026 فشل المسح عند 4:37 م بـ150 سهماً فقط، وقبله
    #    بدقيقة قالت مزامنةُ الشموع: «247 رمز · فشل 22 بلا شموع من المصدر».
    #    وأُعيد التشغيل في 10:23 م فنجح: 269/269 رمز بلا عثرة واحدة.
    #
    #    فالسبب مصدرُ الشموع نفسه: يتعثّر في ساعة الإغلاق وما بعدها بقليل،
    #    ويهدأ مساءً. والمسح إن لم يجد شموعاً في القاعدة سقط إلى وسطاء
    #    عامّين يُخنقون من عناوين GitHub، فيسقط شطرٌ من السوق.
    #
    #    ▸ **ولا يُكسب شيءٌ بالتبكير: السوق يُغلق 3:00 والبيانات لا تتغيّر
    #      بعدها.** فالانتظار خمسَ ساعاتٍ لا يُؤخّر معلومةً، ويشتري موثوقية.
    - cron: '0 17 * * 0-4'
    #
    # 🔁 وموعدٌ احتياطيّ بعده بساعة — لأنّ نداءً واحداً قد يُهمَل
    #
    #    رُصد في 26 أغسطس 2026: الملفّ صحيح والموعد صحيح والأربعاء ضمن
    #    الأيام، **ولم يُطلَق شيء**. وهذا سلوكٌ موثَّقٌ في GitHub: المهامّ
    #    المجدولة تُؤخَّر تحت الضغط وقد تُسقَط تماماً، وأوّلُ موعدٍ بعد
    #    تغيير الـcron أكثرُها عرضةً للإسقاط.
    #
    #    ▸ والتشغيل مرّتين لا يضرّ: المسح يُعيد رفع نفس التحليل، ولا شيء
    #      يتضاعف ولا يُفسد. **وتكرارٌ رخيصٌ خيرٌ من يومٍ بلا تحليل.**
    #    ▸ ولو نجح الأوّل، فالثاني يُحدّثه بما لا يختلف — وتصل رسالتان،
    #      وهو ثمنٌ زهيد مقابل ألّا يبيت المستخدمون على نتائج الأمس.
    - cron: '0 18 * * 0-4'   # 9:00 مساءً بتوقيت الرياض — احتياطيّ
  workflow_dispatch:   # زرّ يدوي للتشغيل الفوري من صفحة Actions (للتجربة)

jobs:
  scan:
    runs-on: ubuntu-latest
    # ⏱️ 20 بدل 15: تثبيت Playwright يأخذ ~3 دقائق، وانتظار المسح صار 10.
    #    فالحدّ القديم لا يترك هامشاً لإرسال الإخطار إن تأخّر المسح.
    timeout-minutes: 20

    steps:
      - name: جلب الملفات
        # ⬆️ v4 ← v7: كان GitHub يُحذّر «Node.js 20 is deprecated» ويُجبر
        #    الإجراءات على Node 24. التحذير لا يُعطّل اليوم، لكنّه إنذارٌ
        #    بتوقّفها لاحقاً — ورفعُها الآن أهون من إصلاحها بعد أن تتعطّل.
        uses: actions/checkout@v7

      - name: تجهيز Node
        uses: actions/setup-node@v7
        with:
          # Node 22 (LTS) بدل 20 — يوافق ما تُجبِر عليه GitHub أصلاً
          node-version: '22'

      - name: تثبيت Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: تشغيل الروبوت
        env:
          # 🔑 المسار الأساسيّ — رمزُ دخولٍ لمرّةٍ واحدة (لا كابتشا عليه)
          SB_URL:       ${{ secrets.SB_URL }}
          BOT_LINK_KEY: ${{ secrets.BOT_LINK_KEY }}
          # 🛟 احتياطيّ — يُستعمل فقط إن تعذّر الرمز
          BOT_EMAIL: ${{ secrets.BOT_EMAIL }}
          BOT_PASS:  ${{ secrets.BOT_PASS }}
          TG_TOKEN:  ${{ secrets.TG_TOKEN }}
          TG_CHAT:   ${{ secrets.TG_CHAT }}
        run: node robot/scan.js

      # ══════════════════════════════════════════════════════════════
      # 🛑 شبكةُ أمانٍ للفشل — لا بديلٌ عن إخطار الروبوت
      #
      # `robot/scan.js` يُبلّغ بنفسه ومعه السبب والعدد:
      #     ✅ المسح التلقائي تمّ — 269 سهم
      #     ⚠️ فشل: تجاوز المسح 10 دقائق (بلغ 214 سهماً)
      # وهي رسائل **مُتحقَّقٌ منها** (اكتمال المسح + عدد ≥ 200).
      #
      # فما فائدة هذه الخطوة إذن؟ تحرس ما لا يستطيع الروبوت حراسته:
      # انهياراً **قبل** أن يعمل أصلاً — فشل تثبيت Playwright، أو نفاد
      # مهلة المهمّة، أو سقوط المُشغِّل. عندها لا أحد يُبلّغك إلا هي.
      #
      # 🗑️ وأُسقط «إخطار النجاح» من هنا: كان يُرسل رسالةً ثانيةً لنفس
      #    العملية تقول «تمّ» لمجرّد انتهاء الخطوة — بلا فحص عددٍ ولا
      #    مهلة. ورسالةٌ تُصدّق نفسها بجانب رسالةٍ مُتحقَّقة تُضعف الثقة
      #    بالاثنتين. النجاح يُعلنه الروبوت وحده، ومعه دليله.
      # ══════════════════════════════════════════════════════════════
      - name: إخطار الفشل (شبكة أمان)
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TG_CHAT }}" \
            -d parse_mode="HTML" \
            -d text="🛑 <b>فشل المسح التلقائي اليومي</b>%0A التحليل المشترك لم يتحدّث — المستخدمون يرون نتائج الأمس.%0A راجع: Actions ← المسح التلقائي اليومي" \
            > /dev/null || true
