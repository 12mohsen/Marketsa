# ══════════════════════════════════════════════════════════════════
# 🤖 المسح التلقائي اليومي — تداول بلس
# يفتح markets-a.com بحساب الروبوت ويشغّل المسح، فيتحدّث التحليل للجميع
# بلا أن تفتح التطبيق بنفسك. يعمل مجاناً على خوادم GitHub.
# ══════════════════════════════════════════════════════════════════
name: المسح التلقائي اليومي

on:
  schedule:
    # 12:30 UTC = 3:30 عصراً بتوقيت الرياض · الأحد–الخميس (أسبوع تداول السعودية)
    - cron: '30 12 * * 0-4'
  workflow_dispatch:   # زرّ يدوي للتشغيل الفوري من صفحة Actions (للتجربة)

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: جلب الملفات
        uses: actions/checkout@v4

      - name: تجهيز Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: تثبيت Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: تشغيل الروبوت
        env:
          BOT_EMAIL: ${{ secrets.BOT_EMAIL }}
          BOT_PASS:  ${{ secrets.BOT_PASS }}
          TG_TOKEN:  ${{ secrets.TG_TOKEN }}
          TG_CHAT:   ${{ secrets.TG_CHAT }}
        run: node robot/scan.js

      # ══════════════════════════════════════════════════════════════
      # 🛑 إخطار الفشل — الفجوة التي تجعل العطل صامتاً
      # بلا هذا: يفشل الروبوت، فلا يتحدّث التحليل المشترك، ويرى كل
      # المستخدمين تحليل الأمس — ولا أحد يعلم. نفس علّة sync-historical
      # التي كانت تعمل يومياً بلا إخطار، وعلّة سكربت جوجل الذي ظلّ
      # يمحو الشيت أياماً بلا إنذار.
      # ══════════════════════════════════════════════════════════════
      - name: إخطار الفشل
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TG_CHAT }}" \
            -d parse_mode="HTML" \
            -d text="🛑 <b>فشل المسح التلقائي اليومي</b>%0A التحليل المشترك لم يتحدّث — المستخدمون يرون نتائج الأمس.%0A راجع: Actions ← المسح التلقائي اليومي" \
            > /dev/null || true

      - name: إخطار النجاح
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TG_CHAT }}" \
            -d parse_mode="HTML" \
            -d text="✅ <b>المسح التلقائي اليومي</b>%0A تمّ التحديث ورُفعت النتائج للجميع." \
            > /dev/null || true
